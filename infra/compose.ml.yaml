services:
  ml-tools:
    profiles: [tools]
    image: lak-analytics-ml-tools:phase8
    build:
      context: ..
      dockerfile: infra/Dockerfile.lak-ml
    environment:
      PG_HOST: postgres
      LAK_POSTGRES_PASSWORD: ${LAK_POSTGRES_PASSWORD:?Keep phase4 credentials}
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
    volumes:
      - ../evidence:/opt/project/evidence
      - ../data/models:/opt/project/data/models
