services:
  mysql:
    image: mysql:8.0.46-oraclelinux9
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${LAK_MYSQL_ROOT_PASSWORD:?Prepare .runtime/lak.env first}
      MYSQL_DATABASE: lak_source
      MYSQL_USER: lak_app
      MYSQL_PASSWORD: ${LAK_MYSQL_APP_PASSWORD:?Prepare .runtime/lak.env first}
    command:
    - --server-id=274103
    - --log-bin=lak-bin
    - --binlog-format=ROW
    - --binlog-row-image=FULL
    - --binlog-expire-logs-seconds=604800
    - --innodb-buffer-pool-size=268435456
    ports:
    - 127.0.0.1:3310:3306
    volumes:
    - mysql_source_data:/var/lib/mysql
    healthcheck:
      test:
      - CMD-SHELL
      - mysqladmin ping -h 127.0.0.1 -uroot -p$${MYSQL_ROOT_PASSWORD} --silent
      interval: 5s
      timeout: 5s
      retries: 36
      start_period: 30s
  source-tools:
    profiles:
    - tools
    build:
      context: ..
      dockerfile: infra/Dockerfile.lak-source
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      MYSQL_HOST: mysql
      MYSQL_PORT: '3306'
      MYSQL_DATABASE: lak_source
      MYSQL_USER: lak_app
      MYSQL_PASSWORD: ${LAK_MYSQL_APP_PASSWORD:?Prepare .runtime/lak.env first}
    volumes:
    - ../evidence:/opt/project/evidence
  postgres:
    image: postgres:16.15-trixie
    restart: unless-stopped
    environment:
      POSTGRES_DB: lak_warehouse
      POSTGRES_USER: lak_dw
      POSTGRES_PASSWORD: ${LAK_POSTGRES_PASSWORD:?Prepare phase4 runtime secrets}
    ports:
    - 127.0.0.1:5435:5432
    volumes:
    - warehouse_data:/var/lib/postgresql/data
    healthcheck:
      test:
      - CMD-SHELL
      - pg_isready -h 127.0.0.1 -U lak_dw -d lak_warehouse
      interval: 5s
      timeout: 5s
      retries: 36
      start_period: 20s
  kafka:
    image: apache/kafka:3.9.1
    hostname: kafka
    restart: unless-stopped
    environment:
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
      KAFKA_NODE_ID: '1'
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:19092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:19092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: '1'
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: '1'
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: '1'
      KAFKA_NUM_PARTITIONS: '1'
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_HEAP_OPTS: -Xms256m -Xmx512m
    volumes:
    - kafka_data:/var/lib/kafka/data
    healthcheck:
      test:
      - CMD-SHELL
      - /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:19092 --list >/dev/null
        2>&1
      interval: 10s
      timeout: 15s
      retries: 24
      start_period: 30s
  connect:
    image: quay.io/debezium/connect:3.2
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      kafka:
        condition: service_healthy
    environment:
      BOOTSTRAP_SERVERS: kafka:19092
      GROUP_ID: lak-connect-cluster
      CONFIG_STORAGE_TOPIC: lak_connect_configs
      OFFSET_STORAGE_TOPIC: lak_connect_offsets
      STATUS_STORAGE_TOPIC: lak_connect_status
      CONFIG_STORAGE_REPLICATION_FACTOR: '1'
      OFFSET_STORAGE_REPLICATION_FACTOR: '1'
      STATUS_STORAGE_REPLICATION_FACTOR: '1'
      OFFSET_STORAGE_PARTITIONS: '1'
      STATUS_STORAGE_PARTITIONS: '1'
      KEY_CONVERTER: org.apache.kafka.connect.json.JsonConverter
      VALUE_CONVERTER: org.apache.kafka.connect.json.JsonConverter
      KEY_CONVERTER_SCHEMAS_ENABLE: 'false'
      VALUE_CONVERTER_SCHEMAS_ENABLE: 'false'
      REST_HOST_NAME: 0.0.0.0
      KAFKA_HEAP_OPTS: -Xms256m -Xmx768m
    ports:
    - 127.0.0.1:8085:8083
  cdc-tools:
    profiles:
    - tools
    image: lak-analytics-cdc-tools:phase4
    build:
      context: ..
      dockerfile: infra/Dockerfile.lak-cdc
    environment:
      PG_HOST: postgres
      LAK_POSTGRES_PASSWORD: ${LAK_POSTGRES_PASSWORD:?Prepare phase4 runtime secrets}
      KAFKA_BOOTSTRAP: kafka:19092
      MYSQL_HOST: mysql
      MYSQL_PORT: '3306'
      MYSQL_DATABASE: lak_source
      MYSQL_USER: lak_app
      MYSQL_PASSWORD: ${LAK_MYSQL_APP_PASSWORD:?Keep phase3 credentials}
      LAK_CDC_PASSWORD: ${LAK_CDC_PASSWORD:?Prepare phase4 runtime secrets}
    volumes:
    - ../evidence:/opt/project/evidence
  collector:
    image: lak-analytics-cdc-tools:phase4
    restart: unless-stopped
    command:
    - capture
    environment:
      PG_HOST: postgres
      LAK_POSTGRES_PASSWORD: ${LAK_POSTGRES_PASSWORD:?Prepare phase4 runtime secrets}
      KAFKA_BOOTSTRAP: kafka:19092
      MYSQL_HOST: mysql
      MYSQL_PORT: '3306'
      MYSQL_DATABASE: lak_source
      MYSQL_USER: lak_app
      MYSQL_PASSWORD: ${LAK_MYSQL_APP_PASSWORD:?Keep phase3 credentials}
      LAK_CDC_PASSWORD: ${LAK_CDC_PASSWORD:?Prepare phase4 runtime secrets}
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
  applier:
    image: lak-analytics-cdc-tools:phase4
    restart: unless-stopped
    command:
    - apply
    environment:
      PG_HOST: postgres
      LAK_POSTGRES_PASSWORD: ${LAK_POSTGRES_PASSWORD:?Prepare phase4 runtime secrets}
      KAFKA_BOOTSTRAP: kafka:19092
      MYSQL_HOST: mysql
      MYSQL_PORT: '3306'
      MYSQL_DATABASE: lak_source
      MYSQL_USER: lak_app
      MYSQL_PASSWORD: ${LAK_MYSQL_APP_PASSWORD:?Keep phase3 credentials}
      LAK_CDC_PASSWORD: ${LAK_CDC_PASSWORD:?Prepare phase4 runtime secrets}
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
volumes:
  mysql_source_data: null
  warehouse_data: null
  kafka_data: null
